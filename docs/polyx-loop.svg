<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="The polyx loop">
  <rect width="900" height="300" fill="#FFFFFF"/>
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#78828F"/></marker>
      <marker id="arrj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A5620F"/></marker>
    </defs>
    <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0F1419">
      <!-- row 1: corpus → alphabet → miner → review → advisor -->
      <rect x="10" y="60" width="130" height="58" rx="2" fill="#FFFFFF" stroke="#BFC7D1"/>
      <text x="75" y="84" text-anchor="middle" font-weight="600">Transcripts</text>
      <text x="75" y="102" text-anchor="middle" font-size="11" fill="#78828F">what the agent did</text>

      <line x1="140" y1="89" x2="182" y2="89" stroke="#78828F" stroke-width="1.5" marker-end="url(#arr)"/>

      <rect x="184" y="60" width="130" height="58" rx="2" fill="#FFFFFF" stroke="#BFC7D1"/>
      <text x="249" y="84" text-anchor="middle" font-weight="600">Typed events</text>
      <text x="249" y="102" text-anchor="middle" font-size="11" fill="#78828F">alphabet, reviewed</text>

      <line x1="314" y1="89" x2="356" y2="89" stroke="#78828F" stroke-width="1.5" marker-end="url(#arr)"/>

      <rect x="358" y="60" width="130" height="58" rx="2" fill="#E0EEEF" stroke="#94C4C8"/>
      <text x="423" y="84" text-anchor="middle" font-weight="600" fill="#125E68">Miner</text>
      <text x="423" y="102" text-anchor="middle" font-size="11" fill="#78828F">no model call, ever</text>

      <line x1="488" y1="89" x2="530" y2="89" stroke="#78828F" stroke-width="1.5" marker-end="url(#arr)"/>

      <rect x="532" y="60" width="130" height="58" rx="2" fill="#FFFFFF" stroke="#BFC7D1"/>
      <text x="597" y="84" text-anchor="middle" font-weight="600">A person</text>
      <text x="597" y="102" text-anchor="middle" font-size="11" fill="#78828F">marks each rule real</text>

      <line x1="662" y1="89" x2="704" y2="89" stroke="#78828F" stroke-width="1.5" marker-end="url(#arr)"/>

      <rect x="706" y="60" width="164" height="58" rx="2" fill="#E0EEEF" stroke="#94C4C8"/>
      <text x="788" y="84" text-anchor="middle" font-weight="600" fill="#125E68">Advisor</text>
      <text x="788" y="102" text-anchor="middle" font-size="11" fill="#78828F">warn · recommend · clear · abstain</text>

      <!-- row 2: agent hook loop -->
      <rect x="706" y="200" width="164" height="58" rx="2" fill="#ECE8F5" stroke="#BFB3DA"/>
      <text x="788" y="224" text-anchor="middle" font-weight="600" fill="#5B4A8A">Claude, about to act</text>
      <text x="788" y="242" text-anchor="middle" font-size="11" fill="#78828F">PreToolUse hook</text>

      <path d="M760 200 V 118" stroke="#78828F" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <text x="748" y="164" text-anchor="end" font-size="11" fill="#49525E">considering: git_push</text>
      <path d="M816 118 V 200" stroke="#78828F" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <text x="828" y="164" font-size="11" fill="#49525E">held 41 / 47</text>

      <!-- new transcripts loop back -->
      <path d="M706 240 H 75 V 118" stroke="#78828F" stroke-width="1" stroke-dasharray="4 4" fill="none" marker-end="url(#arr)"/>
      <text x="390" y="234" text-anchor="middle" font-size="11" fill="#78828F">every decision is logged: the corpus for the next pass</text>

      <!-- Jev annotation, optional -->
      <rect x="184" y="150" width="130" height="50" rx="2" fill="#FAF0E1" stroke="#E3C591" stroke-dasharray="4 3"/>
      <text x="249" y="171" text-anchor="middle" font-weight="600" fill="#A5620F">Jev (optional)</text>
      <text x="249" y="188" text-anchor="middle" font-size="11" fill="#78828F">annotate once, record</text>
      <path d="M249 150 V 120" stroke="#A5620F" stroke-width="1.5" fill="none" marker-end="url(#arrj)"/>
      <text x="262" y="138" font-size="11" fill="#A5620F">obs.* facts</text>
    </g>
  </svg>
